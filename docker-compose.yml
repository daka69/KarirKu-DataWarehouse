# KarirKu UAS BI — PostgreSQL 16 (warehouse) + Metabase (dashboard)
# Jalankan dari folder ini:  docker compose up -d
# Metabase: http://localhost:3000  (di form Add database Metabase: host = db, port = 5432)
# Password: ganti "ganti_password_ini" di DUA tempat di bawah ini dengan password yang sama.
services:
  db:
    image: postgres:16
    container_name: karirku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "ganti_password_ini"
      POSTGRES_DB: dw_lowongan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-metabase-db.sql:/docker-entrypoint-initdb.d/init-metabase-db.sql

  metabase:
    image: metabase/metabase:latest
    container_name: karirku-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: "ganti_password_ini"
      MB_DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
